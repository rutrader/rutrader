<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Ruslan Ishemgulov</title>
  <desc id="desc">Software engineer in Prague. Builds small products with real users and turns market noise into models.</desc>

  <defs>
    <clipPath id="card-clip-1"><rect x="64" y="218" width="340" height="100" rx="14"/></clipPath>
    <clipPath id="card-clip-2"><rect x="424" y="218" width="340" height="100" rx="14"/></clipPath>
    <clipPath id="card-clip-3"><rect x="784" y="218" width="340" height="100" rx="14"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="#0c0c0c"/>

  <!-- accent bar -->
  <rect x="64" y="48" width="48" height="4" rx="2" fill="#3b82f6"/>

  <!-- name -->
  <text x="64" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif" font-size="58" fill="#fafaf9" font-weight="700" letter-spacing="-1">Ruslan Ishemgulov</text>

  <!-- role -->
  <text x="64" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#3b82f6">software engineer</text>
  <text x="270" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#404040">·</text>
  <text x="290" y="164" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#525252">Prague</text>

  <!-- project card 1: piecework -->
  <rect x="64" y="218" width="340" height="100" rx="14" fill="#161616" stroke="#262626" stroke-width="1"/>
  <circle cx="88" cy="246" r="5" fill="#f59e0b"/>
  <text x="102" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e5e5e5" font-weight="500">piecework</text>
  <text x="84" y="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#737373">Where free parsers stop</text>
  <text x="84" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#737373">and language models start</text>

  <!-- project card 2: pigment-wall -->
  <rect x="424" y="218" width="340" height="100" rx="14" fill="#161616" stroke="#262626" stroke-width="1"/>
  <circle cx="448" cy="246" r="5" fill="#a78bfa"/>
  <text x="462" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e5e5e5" font-weight="500">pigment-wall</text>
  <text x="444" y="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#737373">A day is a picture. It colours in</text>
  <text x="444" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#737373">as you burn tokens. macOS menu bar.</text>

  <!-- project card 3: the-vending-machine -->
  <rect x="784" y="218" width="340" height="100" rx="14" fill="#161616" stroke="#262626" stroke-width="1"/>
  <circle cx="808" cy="246" r="5" fill="#34d399"/>
  <text x="822" y="251" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" fill="#e5e5e5" font-weight="500">the-vending-machine</text>
  <text x="804" y="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#737373">What can one hour of work buy?</text>
  <text x="804" y="298" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#737373">62 years of FRED data, one question.</text>

  <!-- bottom links -->
  <text x="64" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#525252">ishemgulov.com</text>
  <text x="236" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#404040">·</text>
  <text x="256" y="368" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#525252">czechstats.eu</text>
</svg>
